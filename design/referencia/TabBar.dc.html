<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-5c80c99b-4a3c-4dee-9f25-511d40b9aaed/styles.css">
<script src="_ds/nocturne-5c80c99b-4a3c-4dee-9f25-511d40b9aaed/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</helmet>
<div style="width:100%;height:82px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 26px;border-top:1px solid var(--color-divider);background:var(--color-bg);box-sizing:border-box">
  <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
    <a href="{{ item.href }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;color:{{ item.color }}">
      <i class="{{ item.cls }}" style="font-size:22px"></i>
      <span>{{ item.label }}</span>
    </a>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:82},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Painel&quot;,&quot;Prospecção&quot;,&quot;Vendas&quot;,&quot;Projetos&quot;,&quot;Mais&quot;],&quot;default&quot;:&quot;Painel&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Painel';
    const list = [
      ['Painel', 'ph-squares-four', 'Painel.dc.html'],
      ['Prospecção', 'ph-kanban', 'Prospeccao.dc.html'],
      ['Vendas', 'ph-receipt', 'Vendas.dc.html'],
      ['Projetos', 'ph-folder-simple', 'Projetos.dc.html'],
      ['Mais', 'ph-dots-three-outline', 'Estoque.dc.html']
    ];
    return { items: list.map(([label, icon, href]) => {
      const on = label === a;
      return { label, href, cls: (on ? 'ph-fill ' : 'ph ') + icon, color: on ? 'var(--color-accent)' : 'var(--color-neutral-500)' };
    }) };
  }
}
</script>
</body>
</html>
